<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Jelly Harris</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/contact.css" />
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo"><img src="assets/logo.png" alt="Jelly Harris" class="nav-logo-img" /><span class="nav-logo-text">Jelly Harris</span></a>
    <ul class="nav-links">
      <li><a href="blog.html">Journal</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
    <button class="nav-burger" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <main class="page-content contact-main">

    <header class="contact-header">
      <span class="label">Get in touch</span>
      <h1 class="display">Contact<svg class="title-strike" viewBox="0 0 1000 80" preserveAspectRatio="none" aria-hidden="true"><path d="M 0,50 C 30,50 50,62 80,38 C 110,14 130,5 175,28 C 220,52 240,70 290,48 C 340,26 365,8 420,32 C 475,56 490,72 545,50 C 600,28 630,5 695,30 C 760,55 780,72 845,48 C 895,30 930,18 975,42 C 988,48 995,50 1000,50" /></svg></h1>
    </header>

    <div class="contact-grid">

      <div class="contact-info">
        <img src="assets/portrait-photo.png" alt="Venice" class="contact-photo" />
        <p class="contact-intro">For collaborations, prints, exhibitions, or just to say hello.</p>

        <div class="contact-details">
          <div class="contact-detail">
            <span class="label">Email</span>
            <a href="mailto:jelisa.harris@gmail.com">jelisa.harris@gmail.com</a>
          </div>
          <div class="contact-detail">
            <span class="label">Based in</span>
            <p>Brussels, Belgium</p>
          </div>
        </div>
      </div>

      <form class="contact-form" id="contact-form">
        <div class="form-group">
          <label class="label" for="name">Name</label>
          <input type="text" id="name" name="name" required placeholder="Your name" />
        </div>
        <div class="form-group">
          <label class="label" for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="your@email.com" />
        </div>
        <div class="form-group">
          <label class="label" for="subject">Subject</label>
          <input type="text" id="subject" name="subject" placeholder="Collaboration, print, exhibition..." />
        </div>
        <div class="form-group">
          <label class="label" for="message">Message</label>
          <textarea id="message" name="message" rows="6" required placeholder="Your message..."></textarea>
        </div>
        <div class="form-submit-row">
          <button type="submit" class="btn btn-red" id="submit-btn">Send message</button>
          <p class="form-status" id="form-status"></p>
        </div>
      </form>

    </div>

  </main>

  <footer>
    <p>© 2026 Jelly Harris</p>
    <p>Photography</p>
    <p>Brussels, Belgium</p>
  </footer>

  <script src="js/nav.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
