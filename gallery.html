<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — Jelly Harris</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/gallery.css" />
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">Jelly Harris</a>
    <ul class="nav-links">
      <li><a href="gallery.html" class="active">Gallery</a></li>
      <li><a href="blog.html">Journal</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <button class="nav-burger" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <main class="page-content gallery-main">

    <header class="page-header">
      <span class="label">Portfolio</span>
      <h1 class="display">Gallery</h1>
    </header>

    <div class="gallery-filters" id="gallery-filters">
      <button class="filter-btn active" data-filter="all">All series</button>
    </div>

    <div class="albums-grid" id="albums-grid">
      <div class="loading-state">
        <span class="label">Loading...</span>
      </div>
    </div>

  </main>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close">✕</button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev">‹</button>
    <button class="lightbox-nav lightbox-next" id="lightbox-next">›</button>
    <div class="lightbox-content">
      <img class="lightbox-img" id="lightbox-img" src="" alt="" />
      <div class="lightbox-info">
        <span class="label" id="lightbox-series"></span>
        <p id="lightbox-caption"></p>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2026 Jelly Harris</p>
    <p>Photography</p>
    <p>Brussels, Belgium</p>
  </footer>

  <script src="js/nav.js"></script>
  <script type="module" src="js/firebase-init.js"></script>
  <script type="module" src="js/gallery.js"></script>
</body>
</html>
