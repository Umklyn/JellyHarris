<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — Jelly Harris</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/gallery.css" />
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo"><img src="assets/logo.png" alt="Jelly Harris" class="nav-logo-img" /><span class="nav-logo-text">Jelly Harris</span></a>
    <ul class="nav-links">
      <li><a href="blog.html">Journal</a></li>
      <li><a href="gallery.html" class="active">Gallery</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <button class="nav-burger" aria-label="Menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <main class="page-content gallery-main">

    <header class="page-header">
      <span class="label">Portfolio</span>
      <h1 class="display">Gallery<svg class="title-strike" viewBox="0 0 1000 80" preserveAspectRatio="none" aria-hidden="true"><path d="M 0,62 C 40,62 55,30 95,52 C 135,72 150,20 200,42 C 250,64 260,18 320,38 C 380,58 395,72 450,48 C 505,24 525,10 590,35 C 655,60 670,72 730,50 C 790,28 810,14 875,40 C 920,58 950,65 1000,52" /></svg></h1>
    </header>

    <div class="gallery-filters" id="gallery-filters">
      <button class="filter-btn active" data-filter="all">All series</button>
    </div>

    <div class="albums-grid" id="albums-grid">
      <div class="loading-state">
        <span class="label">Loading...</span>
      </div>
    </div>

    <!-- Album detail view -->
    <div class="album-detail" id="album-detail" style="display:none;">
      <div class="album-detail-header">
        <button class="back-btn" id="back-to-albums">← Back</button>
        <div>
          <h2 class="album-detail-title" id="album-detail-title"></h2>
          <p class="album-detail-desc" id="album-detail-desc"></p>
        </div>
      </div>
      <div class="photos-grid" id="photos-grid"></div>
    </div>

  </main>

  <button class="lightbox-close" id="lightbox-close">CLOSE</button>
  <button class="lightbox-nav lightbox-prev" id="lightbox-prev">← PREV</button>
  <button class="lightbox-nav lightbox-next" id="lightbox-next">NEXT →</button>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-content">
      <img class="lightbox-img" id="lightbox-img" src="" alt="" />
      <div class="lightbox-info">
        <span class="label" id="lightbox-series"></span>
        <p id="lightbox-caption"></p>
      </div>
    </div>
  </div>

  <footer class="footer-duo">
    <p>© 2026 Jelly Harris · Photography</p>
    <p>Brussels, Belgium <a href="https://www.instagram.com/jelly.harris/" target="_blank" rel="noopener" class="footer-insta" aria-label="Instagram"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none"/></svg></a></p>
  </footer>

  <script src="js/nav.js"></script>
  <script src="js/protect-images.js"></script>
  <script type="module" src="js/firebase-init.js"></script>
  <script type="module" src="js/gallery.js"></script>
</body>
</html>
